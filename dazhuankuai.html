<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>弹球大作战 · 自定义砖块地图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #0a0e1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 20px;
        }

        .game-wrapper {
            background: linear-gradient(145deg, #151e2e, #0b111f);
            padding: 20px 25px 25px 25px;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 1px 2px rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.04);
            max-width: 920px;
            width: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8px 14px 8px;
            color: #c8d6e5;
            font-weight: 600;
            letter-spacing: 0.3px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .lives {
            display: flex;
            gap: 4px;
            font-size: 22px;
            line-height: 1;
        }
        .lives .heart {
            transition: 0.2s;
        }
        .lives .heart.lost {
            opacity: 0.2;
            transform: scale(0.8);
        }

        .score-label {
            font-size: 14px;
            color: #8899bb;
            margin-right: 4px;
        }
        .score-value {
            font-size: 22px;
            color: #f7d44a;
            font-weight: 700;
            min-width: 50px;
            display: inline-block;
        }

        .stamina-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .stamina-label {
            font-size: 14px;
            color: #8899bb;
        }
        .stamina-bar-bg {
            width: 120px;
            height: 14px;
            background: #1a2540;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #2a3a5a;
            position: relative;
        }
        .stamina-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #4ecdc4, #44b39d);
            border-radius: 20px;
            transition: width 0.15s ease;
            box-shadow: 0 0 12px rgba(78, 205, 196, 0.25);
        }
        .stamina-bar-fill.low {
            background: linear-gradient(90deg, #f7b731, #e8962e);
        }
        .stamina-bar-fill.critical {
            background: linear-gradient(90deg, #ff6b6b, #e74c3c);
            animation: pulse-critical 0.8s ease-in-out infinite;
        }
        @keyframes pulse-critical {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        .stamina-text {
            font-size: 13px;
            color: #aabbdd;
            min-width: 32px;
            text-align: right;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 860 / 620;
            border-radius: 16px;
            background: #0d1424;
            box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.6), 0 4px 20px rgba(0, 0, 0, 0.5);
            cursor: crosshair;
            border: 1px solid rgba(255, 255, 255, 0.05);
            touch-action: none;
        }

        /* ---- 配置面板 ---- */
        .config-panel {
            margin-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 14px;
        }
        .config-toggle {
            background: none;
            border: 1px solid #2a3a5a;
            color: #8899bb;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
            background: #151e2e;
        }
        .config-toggle:hover {
            color: #ddeeff;
            border-color: #4a6a8a;
        }
        .config-grid {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px 20px;
            margin-top: 14px;
            background: rgba(0, 0, 0, 0.2);
            padding: 16px 18px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .config-grid.open {
            display: grid;
        }
        .config-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .config-item label {
            font-size: 12px;
            color: #8899bb;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .config-item .value-display {
            font-size: 14px;
            color: #f7d44a;
            font-weight: 600;
            float: right;
        }
        .config-item input[type="range"] {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            background: #1a2540;
            border-radius: 4px;
            outline: none;
            margin: 4px 0;
        }
        .config-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #4ecdc4;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(78, 205, 196, 0.3);
        }
        .config-item input[type="number"] {
            background: #0d1424;
            border: 1px solid #2a3a5a;
            border-radius: 6px;
            color: #ddeeff;
            padding: 4px 8px;
            font-size: 13px;
            width: 80px;
        }
        .config-item textarea {
            background: #0d1424;
            border: 1px solid #2a3a5a;
            border-radius: 6px;
            color: #ddeeff;
            padding: 6px 8px;
            font-size: 13px;
            font-family: 'Courier New', monospace;
            resize: vertical;
            min-height: 80px;
            width: 100%;
            line-height: 1.4;
        }
        .config-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: 4px;
            grid-column: 1 / -1;
            flex-wrap: wrap;
        }
        .btn-apply {
            background: #4ecdc4;
            border: none;
            color: #0a0e1a;
            padding: 6px 24px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 20px rgba(78, 205, 196, 0.15);
        }
        .btn-apply:hover {
            transform: scale(1.03);
            box-shadow: 0 0 30px rgba(78, 205, 196, 0.3);
        }
        .btn-preset {
            background: #1a2540;
            border: 1px solid #2a3a5a;
            color: #aabbdd;
            padding: 4px 14px;
            border-radius: 14px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-preset:hover {
            background: #2a3a5a;
            color: #fff;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            color: #5a6a8a;
            font-size: 13px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .hint {
            display: flex;
            align-items: center;
            gap: 16px;
            color: #6a7a9a;
            flex-wrap: wrap;
        }
        .hint .key-icon {
            display: inline-block;
            background: #1a2540;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: #8a9abb;
        }
        .btn-reset {
            background: #1a2540;
            border: none;
            color: #aabbdd;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #2a3a5a;
        }
        .btn-reset:hover {
            background: #2a3a5a;
            color: #ddeeff;
        }

        .overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            border-radius: 16px;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 12px;
            backdrop-filter: blur(4px);
            z-index: 10;
            pointer-events: none;
        }
        .overlay.show {
            display: flex;
            pointer-events: auto;
        }
        .overlay-title {
            font-size: 44px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
        }
        .overlay-title.win {
            color: #f7d44a;
        }
        .overlay-title.lose {
            color: #ff6b6b;
        }
        .overlay-sub {
            color: #aabbdd;
            font-size: 18px;
            margin-top: 4px;
        }
        .overlay-btn {
            margin-top: 12px;
            background: #f7d44a;
            border: none;
            padding: 12px 40px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 700;
            color: #0a0e1a;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 20px rgba(247, 212, 74, 0.3);
        }
        .overlay-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 30px rgba(247, 212, 74, 0.5);
        }

        .canvas-wrap {
            position: relative;
            display: block;
        }

        @media (max-width: 700px) {
            .config-grid {
                grid-template-columns: 1fr 1fr;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
            }
            .header-left,
            .header-right {
                justify-content: space-between;
            }
            .stamina-bar-bg {
                width: 80px;
            }
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <!-- 顶栏 -->
        <div class="header">
            <div class="header-left">
                <div class="lives" id="livesDisplay">
                    <span class="heart">❤️</span>
                    <span class="heart">❤️</span>
                    <span class="heart">❤️</span>
                </div>
                <div>
                    <span class="score-label">🏆</span>
                    <span class="score-value" id="scoreDisplay">0</span>
                </div>
            </div>
            <div class="header-right">
                <div class="stamina-wrap">
                    <span class="stamina-label">⚡</span>
                    <div class="stamina-bar-bg">
                        <div class="stamina-bar-fill" id="staminaFill" style="width:100%"></div>
                    </div>
                    <span class="stamina-text" id="staminaText">100</span>
                </div>
            </div>
        </div>

        <!-- 画布 -->
        <div class="canvas-wrap">
            <canvas id="gameCanvas" width="860" height="620"></canvas>
            <div class="overlay" id="overlay">
                <div class="overlay-title" id="overlayTitle">游戏结束</div>
                <div class="overlay-sub" id="overlaySub">得分: 0</div>
                <button class="overlay-btn" id="overlayBtn">🔄 再来一次</button>
            </div>
        </div>

        <!-- 配置面板 -->
        <div class="config-panel">
            <button class="config-toggle" id="configToggle">⚙️ 关卡配置</button>
            <div class="config-grid" id="configGrid">
                <!-- 行 -->
                <div class="config-item">
                    <label>砖块行数 <span class="value-display" id="valRows">5</span></label>
                    <input type="range" id="brickRows" min="2" max="8" value="5" step="1">
                </div>
                <!-- 列 -->
                <div class="config-item">
                    <label>砖块列数 <span class="value-display" id="valCols">10</span></label>
                    <input type="range" id="brickCols" min="5" max="14" value="10" step="1">
                </div>
                <!-- 速度 -->
                <div class="config-item">
                    <label>小球速度 <span class="value-display" id="valSpeed">4.2</span></label>
                    <input type="range" id="ballSpeed" min="2" max="6.5" value="4.2" step="0.1">
                </div>
                <!-- 生命 -->
                <div class="config-item">
                    <label>初始生命 <span class="value-display" id="valLives">3</span></label>
                    <input type="range" id="maxLives" min="1" max="6" value="3" step="1">
                </div>
                <!-- 陷阱 -->
                <div class="config-item">
                    <label>陷阱数量 <span class="value-display" id="valTraps">10</span></label>
                    <input type="range" id="trapCount" min="0" max="20" value="10" step="1">
                </div>
                <!-- 星星 -->
                <div class="config-item">
                    <label>星星数量 <span class="value-display" id="valStars">7</span></label>
                    <input type="range" id="starCount" min="0" max="15" value="7" step="1">
                </div>
                <!-- 板子时长 -->
                <div class="config-item">
                    <label>板子持续(帧) <span class="value-display" id="valBoardDur">180</span></label>
                    <input type="range" id="boardDuration" min="60" max="360" value="180" step="10">
                </div>
                <!-- 体力恢复 -->
                <div class="config-item">
                    <label>体力恢复/帧 <span class="value-display" id="valStamina">0.12</span></label>
                    <input type="range" id="staminaRegen" min="0.03" max="0.30" value="0.12" step="0.01">
                </div>
                <!-- 体力消耗系数 -->
                <div class="config-item">
                    <label>体力消耗系数 <span class="value-display" id="valCost">0.08</span></label>
                    <input type="range" id="staminaCost" min="0.02" max="0.20" value="0.08" step="0.005">
                </div>
                <!-- 随机种子 -->
                <div class="config-item">
                    <label>随机种子 <span class="value-display" id="valSeed">0</span></label>
                    <input type="number" id="seedInput" value="0" step="1" min="0" style="background:#0d1424;border:1px solid #2a3a5a;border-radius:6px;color:#ddeeff;padding:4px 8px;font-size:13px;width:80px;">
                    <span style="font-size:11px;color:#5a6a8a;">0=随机，非0=固定布局</span>
                </div>

                <!-- 自定义砖块地图 (新增) -->
                <div class="config-item" style="grid-column: 1 / -1;">
                    <label>✏️ 自定义砖块地图 <span style="font-size:11px;color:#5a6a8a;">（用 # 表示砖块，. 表示空格，换行分隔）</span></label>
                    <textarea id="brickMap" placeholder="例如：\n#####\n#...#\n#####"></textarea>
                    <span style="font-size:11px;color:#5a6a8a;">留空则使用上方行列数生成网格</span>
                </div>

                <div class="config-actions">
                    <button class="btn-apply" id="applyConfigBtn">✅ 应用并重启</button>
                    <span style="color:#5a6a8a; font-size:13px;">预设：</span>
                    <button class="btn-preset" data-preset="classic">经典</button>
                    <button class="btn-preset" data-preset="dense">密集</button>
                    <button class="btn-preset" data-preset="practice">练习</button>
                    <button class="btn-preset" data-preset="chaos">混乱</button>
                    <button class="btn-preset" data-preset="custom1">自定义示例</button>
                </div>
            </div>
        </div>

        <!-- 底栏 -->
        <div class="footer">
            <div class="hint">
                <span>🖱️ 任意方向拖动画板</span>
                <span class="key-icon">边框反弹</span>
                <span>⏱️ 板子持续3s</span>
                <span>🌱 种子控制陷阱/星星</span>
                <span>🧱 自定义砖块地图</span>
            </div>
            <button class="btn-reset" id="resetBtn">🔄 重开</button>
        </div>
    </div>

    <script>
        // ============================================================
        //  游戏主程序 - 支持自定义砖块地图
        // ============================================================

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = 860,
            H = 620;

        // DOM
        const livesEl = document.getElementById('livesDisplay');
        const scoreEl = document.getElementById('scoreDisplay');
        const staminaFill = document.getElementById('staminaFill');
        const staminaText = document.getElementById('staminaText');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlaySub = document.getElementById('overlaySub');
        const overlayBtn = document.getElementById('overlayBtn');
        const resetBtn = document.getElementById('resetBtn');

        // 配置UI
        const configToggle = document.getElementById('configToggle');
        const configGrid = document.getElementById('configGrid');
        const applyBtn = document.getElementById('applyConfigBtn');

        const inputs = {
            brickRows: document.getElementById('brickRows'),
            brickCols: document.getElementById('brickCols'),
            ballSpeed: document.getElementById('ballSpeed'),
            maxLives: document.getElementById('maxLives'),
            trapCount: document.getElementById('trapCount'),
            starCount: document.getElementById('starCount'),
            boardDuration: document.getElementById('boardDuration'),
            staminaRegen: document.getElementById('staminaRegen'),
            staminaCost: document.getElementById('staminaCost'),
            seed: document.getElementById('seedInput'),
            brickMap: document.getElementById('brickMap'),
        };
        const displays = {
            brickRows: document.getElementById('valRows'),
            brickCols: document.getElementById('valCols'),
            ballSpeed: document.getElementById('valSpeed'),
            maxLives: document.getElementById('valLives'),
            trapCount: document.getElementById('valTraps'),
            starCount: document.getElementById('valStars'),
            boardDuration: document.getElementById('valBoardDur'),
            staminaRegen: document.getElementById('valStamina'),
            staminaCost: document.getElementById('valCost'),
            seed: document.getElementById('valSeed'),
        };

        // ============================================================
        //  种子随机数生成器
        // ============================================================
        class SeededRandom {
            constructor(seed) {
                this.seed = seed || 0;
                this.seed = (this.seed >>> 0);
            }
            next() {
                this.seed = (this.seed * 9301 + 49297) % 233280;
                return this.seed / 233280;
            }
            nextRange(min, max) {
                return min + this.next() * (max - min);
            }
            nextInt(min, max) {
                return Math.floor(this.nextRange(min, max + 1));
            }
        }

        // ============================================================
        //  配置对象
        // ============================================================
        const CONFIG = {
            ballRadius: 10,
            ballSpeed: 4.2,
            maxLives: 3,
            maxStamina: 100,
            staminaRegen: 0.12,
            boardWidth: 12,
            boardDuration: 180,
            staminaCostPerPixel: 0.08,
            brickRows: 5,
            brickCols: 10,
            brickGap: 6,
            trapCount: 10,
            starCount: 7,
            starRadius: 11,
            trapRadius: 14,
            seed: 0,
            brickMap: '', // 自定义地图字符串
        };

        // ============================================================
        //  游戏状态
        // ============================================================
        let game = {};
        let rng = null;

        function initGame() {
            syncConfigFromUI();
            let seed = CONFIG.seed;
            if (seed === 0) seed = Date.now() & 0x7fffffff;
            rng = new SeededRandom(seed);

            game = {
                score: 0,
                lives: CONFIG.maxLives,
                stamina: CONFIG.maxStamina,
                maxStamina: CONFIG.maxStamina,
                state: 'playing',
                bricks: [],
                traps: [],
                stars: [],
                boards: [],
                ball: null,
                drawing: false,
                drawStartX: 0,
                drawStartY: 0,
                drawEndX: 0,
                drawEndY: 0,
                rewardEffects: [],
                speedBoost: 1,
                speedBoostTimer: 0,
                shieldActive: false,
                shieldTimer: 0,
                frame: 0,
            };

            createBricks();
            createTraps();
            createStars();
            createBall();

            overlay.classList.remove('show');
            updateLivesUI();
            updateScoreUI();
            updateStaminaUI();
        }

        // ---- 从UI同步配置 ----
        function syncConfigFromUI() {
            CONFIG.brickRows = parseInt(inputs.brickRows.value);
            CONFIG.brickCols = parseInt(inputs.brickCols.value);
            CONFIG.ballSpeed = parseFloat(inputs.ballSpeed.value);
            CONFIG.maxLives = parseInt(inputs.maxLives.value);
            CONFIG.trapCount = parseInt(inputs.trapCount.value);
            CONFIG.starCount = parseInt(inputs.starCount.value);
            CONFIG.boardDuration = parseInt(inputs.boardDuration.value);
            CONFIG.staminaRegen = parseFloat(inputs.staminaRegen.value);
            CONFIG.staminaCostPerPixel = parseFloat(inputs.staminaCost.value);
            CONFIG.seed = parseInt(inputs.seed.value) || 0;
            CONFIG.brickMap = inputs.brickMap.value;

            for (const key in displays) {
                if (displays[key] && inputs[key]) {
                    displays[key].textContent = inputs[key].value;
                }
            }
        }

        // ---- 预设 ----
        function applyPreset(name) {
            const presets = {
                classic: { rows: 5, cols: 10, speed: 4.2, lives: 3, traps: 10, stars: 7, dur: 180, regen: 0.12, cost: 0.08,
                    seed: 0, map: '' },
                dense: { rows: 7, cols: 12, speed: 4.8, lives: 4, traps: 12, stars: 5, dur: 200, regen: 0.10, cost: 0.07,
                    seed: 42, map: '' },
                practice: { rows: 3, cols: 6, speed: 3.0, lives: 5, traps: 3, stars: 10, dur: 240, regen: 0.20, cost: 0.05,
                    seed: 123, map: '' },
                chaos: { rows: 6, cols: 14, speed: 5.5, lives: 2, traps: 18, stars: 12, dur: 150, regen: 0.06, cost: 0.12,
                    seed: 999, map: '' },
                custom1: { rows: 5, cols: 10, speed: 4.2, lives: 3, traps: 8, stars: 6, dur: 180, regen: 0.12, cost: 0.08,
                    seed: 0,
                    map: '#####\n#...#\n#####\n#...#\n#####' },
            };
            const p = presets[name];
            if (!p) return;
            inputs.brickRows.value = p.rows;
            inputs.brickCols.value = p.cols;
            inputs.ballSpeed.value = p.speed;
            inputs.maxLives.value = p.lives;
            inputs.trapCount.value = p.traps;
            inputs.starCount.value = p.stars;
            inputs.boardDuration.value = p.dur;
            inputs.staminaRegen.value = p.regen;
            inputs.staminaCost.value = p.cost;
            inputs.seed.value = p.seed;
            inputs.brickMap.value = p.map;
            for (const key in displays) {
                if (displays[key] && inputs[key]) {
                    displays[key].textContent = inputs[key].value;
                }
            }
            applyConfigAndReset();
        }

        function applyConfigAndReset() {
            syncConfigFromUI();
            resetGame();
        }

        // ============================================================
        //  创建元素
        // ============================================================
        function createBricks() {
            const map = CONFIG.brickMap.trim();
            if (map) {
                // 解析自定义地图
                const lines = map.split('\n').filter(line => line.trim().length > 0);
                const rows = lines.length;
                const cols = lines.reduce((max, line) => Math.max(max, line.length), 0);
                if (rows === 0 || cols === 0) {
                    // 无效地图，退回到网格
                    createGridBricks();
                    return;
                }
                // 计算砖块大小
                const gap = CONFIG.brickGap;
                const usableWidth = W - 40;
                const brickWidth = Math.max(30, (usableWidth - (cols - 1) * gap) / cols);
                const brickHeight = Math.min(26, Math.max(14, brickWidth * 0.35));
                const totalWidth = cols * brickWidth + (cols - 1) * gap;
                const startX = (W - totalWidth) / 2;
                const startY = 50;
                const colors = ['#ff6b6b', '#f7b731', '#f7d44a', '#4ecdc4', '#45b7d1', '#a29bfe', '#fd79a8', '#00b894'];

                for (let r = 0; r < rows; r++) {
                    const line = lines[r];
                    for (let c = 0; c < cols; c++) {
                        const ch = (c < line.length) ? line[c] : ' ';
                        if (ch !== '#') continue; // 只放置 '#'
                        const x = startX + c * (brickWidth + gap);
                        const y = startY + r * (brickHeight + gap);
                        game.bricks.push({
                            x,
                            y,
                            w: brickWidth,
                            h: brickHeight,
                            state: 'intact',
                            color: colors[(r + c) % colors.length],
                            crackAngle: rng.next() * Math.PI * 2,
                        });
                    }
                }
            } else {
                createGridBricks();
            }
        }

        function createGridBricks() {
            const { brickRows, brickCols, brickGap } = CONFIG;
            const totalGap = (brickCols - 1) * brickGap;
            const usableWidth = W - 40;
            const brickWidth = Math.max(30, (usableWidth - totalGap) / brickCols);
            const brickHeight = Math.min(26, Math.max(14, brickWidth * 0.35));
            const startX = (W - (brickCols * (brickWidth + brickGap) - brickGap)) / 2;
            const startY = 50;
            const colors = ['#ff6b6b', '#f7b731', '#f7d44a', '#4ecdc4', '#45b7d1', '#a29bfe', '#fd79a8', '#00b894'];

            for (let r = 0; r < brickRows; r++) {
                for (let c = 0; c < brickCols; c++) {
                    const x = startX + c * (brickWidth + brickGap);
                    const y = startY + r * (brickHeight + brickGap);
                    game.bricks.push({
                        x,
                        y,
                        w: brickWidth,
                        h: brickHeight,
                        state: 'intact',
                        color: colors[(r + c) % colors.length],
                        crackAngle: rng.next() * Math.PI * 2,
                    });
                }
            }
        }

        function createTraps() {
            const count = CONFIG.trapCount;
            const margin = 60;
            for (let i = 0; i < count; i++) {
                let x, y, overlap;
                let attempts = 0;
                do {
                    x = margin + rng.next() * (W - 2 * margin);
                    y = 260 + rng.next() * (H - 340);
                    overlap = game.traps.some(t => Math.hypot(t.x - x, t.y - y) < 40) ||
                        game.bricks.some(b => {
                            if (b.state === 'destroyed') return false;
                            const cx = b.x + b.w / 2,
                                cy = b.y + b.h / 2;
                            return Math.hypot(x - cx, y - cy) < 40;
                        });
                    attempts++;
                } while (overlap && attempts < 50);
                game.traps.push({
                    x,
                    y,
                    r: CONFIG.trapRadius,
                    active: true,
                    pulse: rng.next() * Math.PI * 2,
                });
            }
        }

        function createStars() {
            const count = CONFIG.starCount;
            const margin = 50;
            for (let i = 0; i < count; i++) {
                let x, y, overlap;
                let attempts = 0;
                do {
                    x = margin + rng.next() * (W - 2 * margin);
                    y = 200 + rng.next() * (H - 300);
                    overlap = game.stars.some(s => Math.hypot(s.x - x, s.y - y) < 45) ||
                        game.traps.some(t => Math.hypot(t.x - x, t.y - y) < 45) ||
                        game.bricks.some(b => {
                            if (b.state === 'destroyed') return false;
                            const cx = b.x + b.w / 2,
                                cy = b.y + b.h / 2;
                            return Math.hypot(x - cx, y - cy) < 45;
                        });
                    attempts++;
                } while (overlap && attempts < 50);
                game.stars.push({
                    x,
                    y,
                    r: CONFIG.starRadius,
                    active: true,
                    twinkle: rng.next() * Math.PI * 2,
                });
            }
        }

        function createBall() {
            const r = CONFIG.ballRadius;
            const angle = -Math.PI / 2 + (rng.next() - 0.5) * 1.0;
            const speed = CONFIG.ballSpeed;
            game.ball = {
                x: W / 2 + (rng.next() - 0.5) * 120,
                y: H - 100,
                r: r,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                speed: speed,
                trail: [],
            };
        }

        // ============================================================
        //  工具函数 (保持不变)
        // ============================================================
        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

        function dist(x1, y1, x2, y2) {
            return Math.hypot(x2 - x1, y2 - y1);
        }

        function rectCircleCollision(rx, ry, rw, rh, cx, cy, cr) {
            const nearX = clamp(cx, rx, rx + rw);
            const nearY = clamp(cy, ry, ry + rh);
            const dx = cx - nearX;
            const dy = cy - nearY;
            return (dx * dx + dy * dy) < (cr * cr);
        }

        function pointToSegmentDist(px, py, ax, ay, bx, by) {
            const dx = bx - ax,
                dy = by - ay;
            const lenSq = dx * dx + dy * dy;
            if (lenSq === 0) {
                return { dist: dist(px, py, ax, ay), nearX: ax, nearY: ay };
            }
            let t = ((px - ax) * dx + (py - ay) * dy) / lenSq;
            t = clamp(t, 0, 1);
            const nearX = ax + t * dx;
            const nearY = ay + t * dy;
            return { dist: dist(px, py, nearX, nearY), nearX, nearY, t };
        }

        // ============================================================
        //  板子绘制交互 (保持不变)
        // ============================================================
        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
                e.preventDefault();
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY,
            };
        }

        function startDraw(e) {
            if (game.state !== 'playing') return;
            const pos = getMousePos(e);
            if (game.stamina < 0.8) return;
            game.drawing = true;
            game.drawStartX = clamp(pos.x, 0, W);
            game.drawStartY = clamp(pos.y, 0, H);
            game.drawEndX = game.drawStartX;
            game.drawEndY = game.drawStartY;
        }

        function moveDraw(e) {
            if (!game.drawing || game.state !== 'playing') return;
            const pos = getMousePos(e);
            game.drawEndX = clamp(pos.x, 0, W);
            game.drawEndY = clamp(pos.y, 0, H);
        }

        function endDraw(e) {
            if (!game.drawing || game.state !== 'playing') {
                game.drawing = false;
                return;
            }
            game.drawing = false;
            const x1 = game.drawStartX,
                y1 = game.drawStartY;
            const x2 = game.drawEndX,
                y2 = game.drawEndY;
            const len = dist(x1, y1, x2, y2);
            if (len < 10) return;
            const cost = len * CONFIG.staminaCostPerPixel;
            if (game.stamina < cost) return;
            game.stamina -= cost;
            game.boards.push({
                x1,
                y1,
                x2,
                y2,
                w: CONFIG.boardWidth,
                timer: CONFIG.boardDuration,
                life: 1,
            });
            updateStaminaUI();
        }

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', moveDraw);
        canvas.addEventListener('mouseup', endDraw);
        canvas.addEventListener('mouseleave', (e) => {
            if (game.drawing) endDraw(e);
        });
        canvas.addEventListener('touchstart', startDraw, { passive: false });
        canvas.addEventListener('touchmove', moveDraw, { passive: false });
        canvas.addEventListener('touchend', endDraw, { passive: false });

        // ============================================================
        //  更新逻辑 (保持不变，但砖块碰撞仍使用现有逻辑)
        // ============================================================
        function update() {
            if (game.state !== 'playing') return;
            game.frame++;

            if (game.stamina < game.maxStamina) {
                game.stamina = Math.min(game.maxStamina, game.stamina + CONFIG.staminaRegen);
                updateStaminaUI();
            }

            if (game.speedBoostTimer > 0) {
                game.speedBoostTimer--;
                if (game.speedBoostTimer === 0) game.speedBoost = 1;
            }
            if (game.shieldTimer > 0) {
                game.shieldTimer--;
                if (game.shieldTimer === 0) game.shieldActive = false;
            }

            updateBall();
            updateBoards();
            updateRewardEffects();

            const intactBricks = game.bricks.filter(b => b.state !== 'destroyed');
            if (intactBricks.length === 0 && game.state === 'playing') {
                game.state = 'win';
                showOverlay('🎉 恭喜通关！', '所有砖块已消除！', true);
            }
        }

        function updateBall() {
            const ball = game.ball;
            const r = ball.r;
            const speed = ball.speed * game.speedBoost;

            const currentSpeed = Math.hypot(ball.vx, ball.vy);
            if (currentSpeed > 0.01) {
                const ratio = speed / currentSpeed;
                ball.vx *= ratio;
                ball.vy *= ratio;
            } else {
                ball.vx = speed * (Math.random() - 0.5);
                ball.vy = -speed * 0.8;
            }

            ball.x += ball.vx;
            ball.y += ball.vy;
            ball.trail.push({ x: ball.x, y: ball.y });
            if (ball.trail.length > 14) ball.trail.shift();

            // 边框反弹
            if (ball.x - r < 0) { ball.x = r;
                ball.vx = Math.abs(ball.vx); }
            if (ball.x + r > W) { ball.x = W - r;
                ball.vx = -Math.abs(ball.vx); }
            if (ball.y - r < 0) { ball.y = r;
                ball.vy = Math.abs(ball.vy); }
            if (ball.y + r > H) { ball.y = H - r;
                ball.vy = -Math.abs(ball.vy); }

            // 砖块
            for (const brick of game.bricks) {
                if (brick.state === 'destroyed') continue;
                if (!rectCircleCollision(brick.x, brick.y, brick.w, brick.h, ball.x, ball.y, r)) continue;
                const cx = brick.x + brick.w / 2;
                const cy = brick.y + brick.h / 2;
                const dx = ball.x - cx;
                const dy = ball.y - cy;
                const overlapX = brick.w / 2 + r - Math.abs(dx);
                const overlapY = brick.h / 2 + r - Math.abs(dy);
                if (overlapX < overlapY) {
                    ball.vx = -ball.vx;
                    ball.x += (dx > 0 ? 1 : -1) * overlapX;
                } else {
                    ball.vy = -ball.vy;
                    ball.y += (dy > 0 ? 1 : -1) * overlapY;
                }
                if (brick.state === 'intact') {
                    brick.state = 'cracked';
                    game.score += 5;
                } else if (brick.state === 'cracked') {
                    brick.state = 'destroyed';
                    game.score += 15;
                    spawnParticles(brick.x + brick.w / 2, brick.y + brick.h / 2, brick.color, 12);
                }
                updateScoreUI();
                break;
            }

            // 陷阱
            for (const trap of game.traps) {
                if (!trap.active) continue;
                if (dist(ball.x, ball.y, trap.x, trap.y) < r + trap.r) {
                    trap.active = false;
                    spawnParticles(trap.x, trap.y, '#ff6b6b', 18);
                    if (game.shieldActive) {
                        game.shieldActive = false;
                        game.shieldTimer = 0;
                        showFloatingText(trap.x, trap.y - 20, '🛡️ 护盾抵挡!', '#4ecdc4');
                    } else {
                        loseLife();
                    }
                    break;
                }
            }

            // 星星
            for (const star of game.stars) {
                if (!star.active) continue;
                if (dist(ball.x, ball.y, star.x, star.y) < r + star.r) {
                    star.active = false;
                    spawnParticles(star.x, star.y, '#f7d44a', 20);
                    applyRandomReward(star.x, star.y);
                    break;
                }
            }

            // 板子
            for (const board of game.boards) {
                if (board.timer <= 0) continue;
                const { x1, y1, x2, y2, w } = board;
                const half = w / 2;
                const { dist: d, nearX, nearY } = pointToSegmentDist(ball.x, ball.y, x1, y1, x2, y2);
                if (d < r + half) {
                    const nx = ball.x - nearX;
                    const ny = ball.y - nearY;
                    const len = Math.hypot(nx, ny);
                    if (len < 0.001) continue;
                    const normX = nx / len;
                    const normY = ny / len;
                    const vn = ball.vx * normX + ball.vy * normY;
                    if (vn < 0) {
                        ball.vx -= 2 * vn * normX;
                        ball.vy -= 2 * vn * normY;
                        const overlap = (r + half) - d;
                        ball.x += normX * overlap;
                        ball.y += normY * overlap;
                        ball.vx += (Math.random() - 0.5) * 0.4;
                        ball.vy += (Math.random() - 0.5) * 0.4;
                        spawnParticles((x1 + x2) / 2, (y1 + y2) / 2, '#4ecdc4', 6);
                        board.timer = Math.min(board.timer + 20, CONFIG.boardDuration + 30);
                    }
                    break;
                }
            }

            const sp = Math.hypot(ball.vx, ball.vy);
            if (sp > 0) {
                const target = ball.speed * game.speedBoost;
                ball.vx = (ball.vx / sp) * target;
                ball.vy = (ball.vy / sp) * target;
            }
        }

        function updateBoards() {
            for (let i = game.boards.length - 1; i >= 0; i--) {
                const b = game.boards[i];
                b.timer--;
                if (b.timer <= 0) game.boards.splice(i, 1);
            }
        }

        function updateRewardEffects() {
            for (let i = game.rewardEffects.length - 1; i >= 0; i--) {
                const ef = game.rewardEffects[i];
                ef.life--;
                if (ef.isParticle) {
                    ef.x += ef.vx || 0;
                    ef.y += ef.vy || 0;
                    ef.vy = (ef.vy || 0) + 0.05;
                    ef.alpha *= 0.97;
                } else {
                    ef.y -= 0.6;
                    ef.alpha *= 0.98;
                }
                if (ef.life <= 0 || ef.alpha < 0.02) {
                    game.rewardEffects.splice(i, 1);
                }
            }
        }

        function loseLife() {
            game.lives--;
            updateLivesUI();
            spawnParticles(game.ball.x, game.ball.y, '#ff6b6b', 25);
            if (game.lives <= 0) {
                game.state = 'gameover';
                showOverlay('💀 游戏结束', `得分: ${game.score}`, false);
                return;
            }
            const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.8;
            const speed = CONFIG.ballSpeed;
            game.ball.x = W / 2 + (Math.random() - 0.5) * 100;
            game.ball.y = H - 100;
            game.ball.vx = Math.cos(angle) * speed;
            game.ball.vy = Math.sin(angle) * speed;
            game.ball.trail = [];
            game.speedBoost = 1;
            game.speedBoostTimer = 0;
            game.shieldActive = false;
            game.shieldTimer = 0;
        }

        function applyRandomReward(x, y) {
            const rewards = [
                { emoji: '❤️', label: '+1 生命', action: () => { game.lives = Math.min(CONFIG.maxLives, game.lives + 1);
                        updateLivesUI(); } },
                { emoji: '⭐', label: '+20 分', action: () => { game.score += 20;
                        updateScoreUI(); } },
                { emoji: '⚡', label: '+30 体力', action: () => { game.stamina = Math.min(game.maxStamina, game.stamina + 30);
                        updateStaminaUI(); } },
                { emoji: '🚀', label: '速度提升 5s', action: () => { game.speedBoost = 1.6;
                        game.speedBoostTimer = 300; } },
                { emoji: '🛡️', label: '护盾 5s', action: () => { game.shieldActive = true;
                        game.shieldTimer = 300; } },
            ];
            const reward = rewards[Math.floor(Math.random() * rewards.length)];
            reward.action();
            showFloatingText(x, y - 10, `${reward.emoji} ${reward.label}`, '#f7d44a');
            spawnParticles(x, y, '#f7d44a', 15);
        }

        function showFloatingText(x, y, text, color) {
            game.rewardEffects.push({ x, y, text, color, life: 80, alpha: 1, isParticle: false });
        }

        function spawnParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 3;
                game.rewardEffects.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1,
                    life: 30 + Math.random() * 30,
                    alpha: 1,
                    size: 2 + Math.random() * 4,
                    color,
                    isParticle: true,
                });
            }
        }

        // ============================================================
        //  UI 更新
        // ============================================================
        function updateLivesUI() {
            const hearts = livesEl.querySelectorAll('.heart');
            hearts.forEach((el, i) => {
                el.classList.toggle('lost', i >= game.lives);
            });
        }

        function updateScoreUI() {
            scoreEl.textContent = game.score;
        }

        function updateStaminaUI() {
            const pct = Math.max(0, (game.stamina / game.maxStamina) * 100);
            staminaFill.style.width = pct + '%';
            staminaText.textContent = Math.floor(game.stamina);
            staminaFill.classList.remove('low', 'critical');
            if (pct < 25) staminaFill.classList.add('critical');
            else if (pct < 50) staminaFill.classList.add('low');
        }

        function showOverlay(title, sub, isWin) {
            overlayTitle.textContent = title;
            overlayTitle.className = 'overlay-title ' + (isWin ? 'win' : 'lose');
            overlaySub.textContent = sub;
            overlay.classList.add('show');
        }

        // ============================================================
        //  渲染 (与之前相同)
        // ============================================================
        function render() {
            ctx.clearRect(0, 0, W, H);

            const grad = ctx.createRadialGradient(W / 2, H / 2, 100, W / 2, H / 2, 500);
            grad.addColorStop(0, '#141e33');
            grad.addColorStop(1, '#090d1a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            ctx.strokeStyle = 'rgba(255,255,255,0.02)';
            ctx.lineWidth = 1;
            for (let i = 0; i < W; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, H);
                ctx.stroke();
            }
            for (let i = 0; i < H; i += 40) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(W, i);
                ctx.stroke();
            }

            // 砖块
            for (const brick of game.bricks) {
                if (brick.state === 'destroyed') continue;
                const { x, y, w, h, state, color } = brick;
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 8;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 2;
                ctx.globalAlpha = state === 'cracked' ? 0.7 : 1;
                const grad2 = ctx.createLinearGradient(x, y, x, y + h);
                if (state === 'cracked') {
                    grad2.addColorStop(0, color);
                    grad2.addColorStop(1, darkenColor(color, 0.3));
                } else {
                    grad2.addColorStop(0, lightenColor(color, 0.2));
                    grad2.addColorStop(1, darkenColor(color, 0.2));
                }
                ctx.fillStyle = grad2;
                ctx.fillRect(x, y, w, h);
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                ctx.lineWidth = 1;
                ctx.strokeRect(x, y, w, h);
                if (state === 'cracked') {
                    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
                    ctx.lineWidth = 2;
                    const cx = x + w / 2,
                        cy = y + h / 2;
                    const angle = brick.crackAngle || 0;
                    for (let i = 0; i < 3; i++) {
                        const a = angle + i * 0.8;
                        const len = Math.min(w, h) * 0.35;
                        ctx.beginPath();
                        ctx.moveTo(cx, cy);
                        ctx.lineTo(cx + Math.cos(a) * len, cy + Math.sin(a) * len);
                        ctx.stroke();
                    }
                }
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;
                if (state === 'intact') {
                    ctx.fillStyle = 'rgba(255,255,255,0.08)';
                    ctx.fillRect(x + 3, y + 2, w - 6, 4);
                }
            }

            // 陷阱
            for (const trap of game.traps) {
                if (!trap.active) continue;
                const { x, y, r } = trap;
                trap.pulse += 0.04;
                const glow = ctx.createRadialGradient(x, y, r * 0.5, x, y, r * 1.8);
                glow.addColorStop(0, 'rgba(255,80,80,0.15)');
                glow.addColorStop(1, 'rgba(255,80,80,0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(x, y, r * 1.8, 0, Math.PI * 2);
                ctx.fill();
                const pulseSize = 1 + 0.06 * Math.sin(trap.pulse);
                ctx.shadowColor = 'rgba(255,60,60,0.5)';
                ctx.shadowBlur = 20;
                ctx.fillStyle = '#cc2233';
                ctx.beginPath();
                ctx.arc(x, y, r * pulseSize, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ff4455';
                ctx.beginPath();
                ctx.arc(x, y, r * 0.6 * pulseSize, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.7)';
                ctx.lineWidth = 2.5;
                const s = r * 0.45 * pulseSize;
                ctx.beginPath();
                ctx.moveTo(x - s, y - s);
                ctx.lineTo(x + s, y + s);
                ctx.moveTo(x + s, y - s);
                ctx.lineTo(x - s, y + s);
                ctx.stroke();
            }

            // 星星
            for (const star of game.stars) {
                if (!star.active) continue;
                const { x, y, r } = star;
                star.twinkle += 0.05;
                const scale = 1 + 0.12 * Math.sin(star.twinkle);
                const s = r * scale;
                const glow2 = ctx.createRadialGradient(x, y, 0, x, y, s * 2.5);
                glow2.addColorStop(0, 'rgba(247,212,74,0.2)');
                glow2.addColorStop(1, 'rgba(247,212,74,0)');
                ctx.fillStyle = glow2;
                ctx.beginPath();
                ctx.arc(x, y, s * 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowColor = 'rgba(247,212,74,0.6)';
                ctx.shadowBlur = 25;
                ctx.fillStyle = '#f7d44a';
                ctx.beginPath();
                const spikes = 5;
                const outer = s;
                const inner = s * 0.4;
                for (let i = 0; i < spikes * 2; i++) {
                    const radius = i % 2 === 0 ? outer : inner;
                    const angle = (i / (spikes * 2)) * Math.PI * 2 - Math.PI / 2;
                    const px = x + Math.cos(angle) * radius;
                    const py = y + Math.sin(angle) * radius;
                    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.beginPath();
                ctx.arc(x - s * 0.2, y - s * 0.3, s * 0.15, 0, Math.PI * 2);
                ctx.fill();
            }

            // 板子
            for (const board of game.boards) {
                const alpha = Math.min(1, board.timer / 30);
                const { x1, y1, x2, y2, w } = board;
                const half = w / 2;
                const dx = x2 - x1,
                    dy = y2 - y1;
                const len = Math.hypot(dx, dy);
                if (len < 0.001) continue;
                const ux = dx / len,
                    uy = dy / len;
                const nx = -uy,
                    ny = ux;
                const corners = [
                    { x: x1 + nx * half, y: y1 + ny * half },
                    { x: x1 - nx * half, y: y1 - ny * half },
                    { x: x2 - nx * half, y: y2 - ny * half },
                    { x: x2 + nx * half, y: y2 + ny * half },
                ];
                ctx.globalAlpha = alpha;
                ctx.shadowColor = 'rgba(78,205,196,0.5)';
                ctx.shadowBlur = 18;
                const grad3 = ctx.createLinearGradient(
                    (x1 + x2) / 2 - nx * half, (y1 + y2) / 2 - ny * half,
                    (x1 + x2) / 2 + nx * half, (y1 + y2) / 2 + ny * half
                );
                grad3.addColorStop(0, '#6ee7de');
                grad3.addColorStop(0.5, '#4ecdc4');
                grad3.addColorStop(1, '#2ea89e');
                ctx.fillStyle = grad3;
                ctx.beginPath();
                ctx.moveTo(corners[0].x, corners[0].y);
                for (let i = 1; i < 4; i++) ctx.lineTo(corners[i].x, corners[i].y);
                ctx.closePath();
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.25)';
                const midX = (x1 + x2) / 2,
                    midY = (y1 + y2) / 2;
                const hLen = len * 0.5;
                const offset = half * 0.3;
                ctx.beginPath();
                ctx.moveTo(midX - ux * hLen + nx * offset, midY - uy * hLen + ny * offset);
                ctx.lineTo(midX + ux * hLen + nx * offset, midY + uy * hLen + ny * offset);
                ctx.lineWidth = 3;
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.stroke();
                ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(corners[0].x, corners[0].y);
                for (let i = 1; i < 4; i++) ctx.lineTo(corners[i].x, corners[i].y);
                ctx.closePath();
                ctx.stroke();
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
                const pct = board.timer / CONFIG.boardDuration;
                const barLen = len * 0.8;
                const startX = midX - ux * barLen * 0.5 + nx * (half + 4);
                const startY = midY - uy * barLen * 0.5 + ny * (half + 4);
                ctx.fillStyle = 'rgba(255,255,255,0.1)';
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(startX + ux * barLen, startY + uy * barLen);
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.strokeStyle = `rgba(78,205,196,${0.5 + 0.5 * pct})`;
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(startX + ux * barLen * pct, startY + uy * barLen * pct);
                ctx.stroke();
            }

            // 小球
            const ball = game.ball;
            for (let i = 0; i < ball.trail.length; i++) {
                const t = ball.trail[i];
                const alpha2 = (i / ball.trail.length) * 0.35;
                const radius = ball.r * (0.3 + 0.7 * (i / ball.trail.length));
                ctx.globalAlpha = alpha2;
                ctx.fillStyle = '#4ecdc4';
                ctx.beginPath();
                ctx.arc(t.x, t.y, radius, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            const grad4 = ctx.createRadialGradient(
                ball.x - ball.r * 0.3, ball.y - ball.r * 0.3, ball.r * 0.1,
                ball.x, ball.y, ball.r
            );
            grad4.addColorStop(0, '#8cf0e8');
            grad4.addColorStop(0.6, '#4ecdc4');
            grad4.addColorStop(1, '#1a8a82');
            ctx.shadowColor = 'rgba(78,205,196,0.6)';
            ctx.shadowBlur = 25;
            ctx.fillStyle = grad4;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.beginPath();
            ctx.arc(ball.x - ball.r * 0.25, ball.y - ball.r * 0.3, ball.r * 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.beginPath();
            ctx.arc(ball.x - ball.r * 0.1, ball.y - ball.r * 0.5, ball.r * 0.15, 0, Math.PI * 2);
            ctx.fill();

            if (game.shieldActive) {
                ctx.strokeStyle = `rgba(78,205,196,${0.4 + 0.3 * Math.sin(game.frame * 0.1)})`;
                ctx.lineWidth = 3;
                ctx.shadowColor = 'rgba(78,205,196,0.5)';
                ctx.shadowBlur = 30;
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.r + 10, 0, Math.PI * 2);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
            if (game.speedBoost > 1 && game.speedBoostTimer > 0) {
                ctx.fillStyle = 'rgba(247,212,74,0.15)';
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.r + 16, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#f7d44a';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('⚡', ball.x, ball.y - ball.r - 18);
            }

            // 特效
            for (const ef of game.rewardEffects) {
                ctx.globalAlpha = ef.alpha || 1;
                if (ef.isParticle) {
                    ctx.fillStyle = ef.color || '#f7d44a';
                    ctx.shadowColor = 'rgba(255,255,255,0.1)';
                    ctx.shadowBlur = 8;
                    const size = ef.size || 3;
                    ctx.beginPath();
                    ctx.arc(ef.x, ef.y, size * (ef.alpha || 1), 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                } else {
                    ctx.shadowColor = 'rgba(0,0,0,0.6)';
                    ctx.shadowBlur = 12;
                    ctx.font = 'bold 20px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillStyle = ef.color || '#f7d44a';
                    ctx.fillText(ef.text, ef.x, ef.y);
                    ctx.shadowBlur = 0;
                }
                ctx.globalAlpha = 1;
            }

            // 预览
            if (game.drawing) {
                const x1 = game.drawStartX,
                    y1 = game.drawStartY;
                const x2 = game.drawEndX,
                    y2 = game.drawEndY;
                const len = dist(x1, y1, x2, y2);
                const cost = len * CONFIG.staminaCostPerPixel;
                const canAfford = game.stamina >= cost && len > 10;
                ctx.globalAlpha = 0.5;
                ctx.shadowColor = 'rgba(78,205,196,0.3)';
                ctx.shadowBlur = 15;
                const previewColor = canAfford ? 'rgba(78,205,196,0.5)' : 'rgba(255,80,80,0.5)';
                const half = CONFIG.boardWidth / 2;
                const dx = x2 - x1,
                    dy = y2 - y1;
                const len2 = Math.hypot(dx, dy);
                if (len2 > 1) {
                    const ux = dx / len2,
                        uy = dy / len2;
                    const nx = -uy,
                        ny = ux;
                    const corners = [
                        { x: x1 + nx * half, y: y1 + ny * half },
                        { x: x1 - nx * half, y: y1 - ny * half },
                        { x: x2 - nx * half, y: y2 - ny * half },
                        { x: x2 + nx * half, y: y2 + ny * half },
                    ];
                    ctx.fillStyle = previewColor;
                    ctx.beginPath();
                    ctx.moveTo(corners[0].x, corners[0].y);
                    for (let i = 1; i < 4; i++) ctx.lineTo(corners[i].x, corners[i].y);
                    ctx.closePath();
                    ctx.fill();
                    if (len > 10) {
                        ctx.shadowBlur = 0;
                        ctx.globalAlpha = 0.7;
                        ctx.fillStyle = canAfford ? '#4ecdc4' : '#ff6b6b';
                        ctx.font = '12px sans-serif';
                        ctx.textAlign = 'center';
                        const label = canAfford ? `⚡ ${Math.floor(cost)}` : '❌ 体力不足';
                        const midX = (x1 + x2) / 2,
                            midY = (y1 + y2) / 2;
                        ctx.fillText(label, midX, midY - half - 8);
                    }
                }
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }

            if (game.state === 'playing') {
                const intact = game.bricks.filter(b => b.state !== 'destroyed').length;
                ctx.fillStyle = 'rgba(255,255,255,0.06)';
                ctx.font = '13px sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText(`🧱 ${intact}  |  🎯 任意画板  |  🌱 种子: ${CONFIG.seed || '随机'}`, 16, H - 14);
                ctx.textAlign = 'right';
                ctx.fillStyle = 'rgba(255,255,255,0.04)';
                ctx.fillText(`v6.0`, W - 16, H - 14);
            }
        }

        // ============================================================
        //  颜色工具
        // ============================================================
        function lightenColor(color, amount) {
            const c = hexToRgb(color);
            const r = Math.min(255, c.r + (255 - c.r) * amount);
            const g = Math.min(255, c.g + (255 - c.g) * amount);
            const b = Math.min(255, c.b + (255 - c.b) * amount);
            return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
        }

        function darkenColor(color, amount) {
            const c = hexToRgb(color);
            const r = c.r * (1 - amount);
            const g = c.g * (1 - amount);
            const b = c.b * (1 - amount);
            return `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 255, g: 255, b: 255 };
        }

        // ============================================================
        //  游戏循环 & 重置
        // ============================================================
        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        function resetGame() {
            syncConfigFromUI();
            initGame();
            overlay.classList.remove('show');
        }

        resetBtn.addEventListener('click', resetGame);
        overlayBtn.addEventListener('click', resetGame);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') resetGame();
        });

        // ---- 配置面板事件 ----
        configToggle.addEventListener('click', () => {
            configGrid.classList.toggle('open');
        });

        // 滑块实时更新显示值
        for (const key in inputs) {
            if (inputs[key] && inputs[key].type === 'range') {
                inputs[key].addEventListener('input', () => {
                    if (displays[key]) {
                        displays[key].textContent = inputs[key].value;
                    }
                });
            }
        }
        inputs.seed.addEventListener('input', () => {
            displays.seed.textContent = inputs.seed.value;
        });

        applyBtn.addEventListener('click', applyConfigAndReset);

        document.querySelectorAll('.btn-preset').forEach(btn => {
            btn.addEventListener('click', () => {
                applyPreset(btn.dataset.preset);
            });
        });

        // ============================================================
        //  启动
        // ============================================================
        initGame();
        gameLoop();

        console.log('🎮 弹球大作战 v6.0 - 自定义砖块地图');
        console.log('✏️ 在配置面板的「自定义砖块地图」中用 # 和 . 自由设计砖墙');
        console.log('🌱 种子控制陷阱和星星的位置');
        console.log('📦 预设「自定义示例」展示了一个镂空图案');
        console.log('⌨️ 按 R 键快速重启');
    </script>
</body>
</html>
